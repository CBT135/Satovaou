name: Déploiement

# Génère les horaires (GTFS -> web/data/network.json) puis publie le site sur GitHub Pages.
# Tourne à chaque push sur main, chaque lundi matin, et à la demande (onglet Actions > Déploiement > Run workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests (GTFS fictifs)
        run: |
          python tests/make_fake_gtfs.py
          python scripts/build_data.py --only-local --start 2026-11-22 --out /tmp/fake \
            --local ruban=tests/gtfs/ruban.zip sncf=tests/gtfs/sncf.zip tcl=tests/gtfs/tcl.zip \
                    rhonexpress=tests/gtfs/rhonexpress.zip cri38=tests/gtfs/cre.zip flixbus=tests/gtfs/flixbus.zip
          node tests/router.test.mjs /tmp/fake/network.json

      - name: Génération des horaires réels
        run: python scripts/build_data.py --out web/data

      - name: Résumé
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("web/data/network.json"))
          print(f"### Horaires générés le {d['generated']}\n")
          print(f"{len(d['stops'])} arrêts, {len(d['routes'])} lignes, {len(d['trips'])} courses\n")
          print("| Réseau | État | Courses | Lignes trouvées | Lignes absentes |\n|---|---|---|---|---|")
          for f in d["feeds"]:
              print(f"| {f.get('label')} | {f.get('status')} | {f.get('trips', '')} | {', '.join(f.get('routes', []))[:200]} | {', '.join(f.get('missing', []))} |")
          print(f"\nVacances zone A récupérées : {len(d['holidays'])}\n")
          print("<details><summary>Détail des lignes retenues</summary>\n")
          print("| Réseau | Ligne | Nom | Scolaire | TAD |\n|---|---|---|---|---|")
          for r in d["routes"]:
              print(f"| {d['feeds'][r['f']]['label']} | {r['s']} | {r['l'][:80]} | {'oui' if r['sc'] else ''} | {'oui' if r['tad'] else ''} |")
          print("\n</details>")
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
